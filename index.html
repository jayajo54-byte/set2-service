<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자치행정 협력사업 신청 현황</title>
<style>
  body{font-family:"Malgun Gothic",system-ui,sans-serif;max-width:980px;margin:0 auto;padding:24px 16px;background:#f5f7fa;color:#1b2430}
  h1{margin:0 0 4px} small{color:#5b6675}
  .rule{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:10px 14px;margin:14px 0}
  .sheet{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:12px;margin:14px 0}
  .sheet iframe{width:100%;height:340px;border:0}
  #sum{font-weight:700;margin:10px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .card{background:#fff;border:1px solid #dde3ea;border-left:6px solid #999;border-radius:8px;padding:12px}
  .card.ok{border-left-color:#1f9d55} .card.no{border-left-color:#d64545}
  .t{font-weight:700;margin-bottom:4px}
  .badge{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:10px;font-size:13px;font-weight:700;color:#fff}
  .ok .badge{background:#1f9d55} .no .badge{background:#d64545}
</style>
</head>
<body>
  <h1>자치행정 협력사업 신청 현황</h1>
  <small>지자체 협력사업 신청 10건 · 금액 단위 천원</small>

  <div class="rule">판정 기준: 한도액 = 인구수 × <b id="per"></b>천원(1인당). 신청 예산이 한도액 이하면 <b style="color:#1f9d55">승인</b>, 초과면 <b style="color:#d64545">반려</b>. (문제에 한도액이 제시되지 않아 가정한 기준)</div>

  <section class="sheet">
    <b>신청 자료 요약 (Google Sheets)</b>
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSypZuTcZzhkjxBC6eT2c7VlT9LN2Knn_q3rs7LcrB58F0qFZl3RQPCWL0UPV_aXhTcP2waxObc6Kyn/pubhtml?widget=true&amp;headers=false" title="협력사업 신청 요약 Google Sheets"></iframe>
  </section>

  <div id="sum"></div>
  <div class="grid" id="grid"></div>

<script>
const PER_CAPITA = 10;   // 1인당 한도(천원) — 기준을 바꾸려면 이 숫자만 수정
const DATA = [{"지자체명": "가람군", "인구수": 30000, "신청액": 250000, "예산": 250000, "사업명": "가람군 청년 농촌 정착 지원 사업"}, {"지자체명": "나봄시", "인구수": 45000, "신청액": 500000, "예산": 500000, "사업명": "나봄시 스마트 관광 플랫폼 구축"}, {"지자체명": "다솔구", "인구수": 80000, "신청액": 600000, "예산": 600000, "사업명": "다솔구 어르신 디지털 친화 도시 조성"}, {"지자체명": "라윤시", "인구수": 60000, "신청액": 700000, "예산": 700000, "사업명": "라윤시 도심 보행자 안전망 구축"}, {"지자체명": "마을군", "인구수": 25000, "신청액": 200000, "예산": 200000, "사업명": "마을군 지역화폐 활성화 사업"}, {"지자체명": "바람시", "인구수": 100000, "신청액": 950000, "예산": 950000, "사업명": "바람시 친환경 에너지 전환 사업"}, {"지자체명": "사계구", "인구수": 55000, "신청액": 600000, "예산": 600000, "사업명": "사계구 청소년 안심 귀가 시스템"}, {"지자체명": "아현시", "인구수": 70000, "신청액": 650000, "예산": 650000, "사업명": "아현시 도시재생 거점공간 조성"}, {"지자체명": "자연군", "인구수": 40000, "신청액": 380000, "예산": 380000, "사업명": "자연군 생태관광 마을 조성"}, {"지자체명": "차돌시", "인구수": 90000, "신청액": 880000, "예산": 880000, "사업명": "차돌시 산업단지 디지털 전환 사업"}];
document.getElementById("per").textContent = PER_CAPITA;
const fmt = n => n.toLocaleString("ko-KR");
let ok = 0;
document.getElementById("grid").innerHTML = DATA.map(d => {
  const limit = d.인구수 * PER_CAPITA, pass = d.예산 <= limit; if (pass) ok++;
  return `<div class="card ${pass ? "ok" : "no"}"><div class="t">${d.지자체명}</div><div>${d.사업명}</div>
  <div>예산 ${fmt(d.예산)}천원 · 한도 ${fmt(limit)}천원</div><span class="badge">${pass ? "승인" : "반려"}</span></div>`;
}).join("");
document.getElementById("sum").textContent = `전체 ${DATA.length}건 · 승인 ${ok}건 / 반려 ${DATA.length - ok}건`;
</script>
</body>
</html>
